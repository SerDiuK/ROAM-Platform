  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#1e40af">operator · NFC checkin · accept dispatch</text>

  <rect x="80" y="400" width="400" height="120" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>

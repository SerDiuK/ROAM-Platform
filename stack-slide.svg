  <text x="800" y="510" text-anchor="middle" font-size="14" fill="#78350f">Zod (shared) · WebSocket · CoT TCP</text>

  <rect x="540" y="560" width="250" height="120" rx="14" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>

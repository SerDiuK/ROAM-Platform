  <text x="800" y="362" text-anchor="middle" font-size="12" fill="#a16207">incident → briefing → dispatch → push → accept → payout</text>

  <rect x="540" y="420" width="520" height="120" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>

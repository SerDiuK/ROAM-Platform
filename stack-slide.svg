  <text x="1320" y="248" text-anchor="middle" font-size="14" fill="#6d28d9">claude-opus-4-7 · tool-use API</text>
  <text x="1320" y="272" text-anchor="middle" font-size="13" fill="#6d28d9">incident classification + briefing</text>

  <rect x="1120" y="320" width="400" height="120" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="1320" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#5b21b6">Deepgram</text>
  <text x="1320" y="388" text-anchor="middle" font-size="14" fill="#6d28d9">streaming STT · Nova-3</text>
  <text x="1320" y="412" text-anchor="middle" font-size="13" fill="#6d28d9">emergency call → transcript</text>

  <rect x="1120" y="460" width="400" height="120" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
  <text x="1320" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#5b21b6">Crossmint</text>
  <text x="1320" y="528" text-anchor="middle" font-size="14" fill="#6d28d9">embedded agent wallet · Solana</text>
  <text x="1320" y="552" text-anchor="middle" font-size="13" fill="#6d28d9">on-chain spending policies · USDC</text>

  <rect x="1120" y="600" width="400" height="120" rx="14" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/>
  <text x="1320" y="640" text-anchor="middle" font-size="22" font-weight="700" fill="#ddd6fe">Solana</text>
  <text x="1320" y="668" text-anchor="middle" font-size="14" fill="#c4b5fd">Anchor program · devnet</text>
  <text x="1320" y="692" text-anchor="middle" font-size="13" fill="#c4b5fd">session · dispatch · response · USDC tx</text>

  <!-- ============ ARROWS ============ -->
  <line x1="490" y1="280" x2="530" y2="285" stroke="#475569" stroke-width="2.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <line x1="490" y1="460" x2="530" y2="475" stroke="#475569" stroke-width="2.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <line x1="490" y1="610" x2="530" y2="540" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="1070" y1="240" x2="1110" y2="240" stroke="#475569" stroke-width="2.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <line x1="1070" y1="345" x2="1110" y2="380" stroke="#475569" stroke-width="2.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <line x1="1070" y1="500" x2="1110" y2="520" stroke="#475569" stroke-width="2.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <line x1="1070" y1="540" x2="1115" y2="650" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M 810 660 Q 600 760 380 700 Q 280 670 280 345" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ BOTTOM TAGLINE ============ -->
  <text x="800" y="800" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Voice → AI Briefing → Confirm → Push → Accept → USDC Payout</text>
  <text x="800" y="828" text-anchor="middle" font-size="14" fill="#64748b">Every step recorded on Solana · auditable agentic commerce in life-safety contexts</text>
  <text x="800" y="858" text-anchor="middle" font-size="12" fill="#94a3b8">EasyA Consensus Hackathon · Miami · May 5–7 2026</text>

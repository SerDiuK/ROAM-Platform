  </defs>

  <rect width="1600" height="900" fill="#fafaf9"/>

  <text x="800" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#0f172a">ROAM — Tech Stack</text>
  <text x="800" y="92" text-anchor="middle" font-size="16" fill="#64748b">Tactical fleet platform · agentic dispatch · Solana audit trail</text>

  <!-- ============ COLUMN 1: CLIENTS ============ -->

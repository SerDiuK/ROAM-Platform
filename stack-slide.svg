  <text x="800" y="160" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2" fill="#a16207">BACKEND + AGENT</text>

  <rect x="540" y="180" width="520" height="220" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="800" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#78350f">Agent Loop</text>
  <text x="800" y="252" text-anchor="middle" font-size="15" fill="#78350f">Claude tool-use · classify · geo-query · price · brief</text>
  <text x="800" y="280" text-anchor="middle" font-size="13" fill="#78350f">human-in-the-loop confirm · or 3s auto-confirm demo mode</text>

  <text x="665" y="650" text-anchor="middle" font-size="13" fill="#3f6212">incidents · dispatches</text>

  <rect x="810" y="560" width="250" height="120" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="935" y="600" text-anchor="middle" font-size="20" font-weight="700" fill="#78350f">Push Fan-out</text>
  <text x="935" y="628" text-anchor="middle" font-size="13" fill="#78350f">Expo Server SDK</text>
  <text x="935" y="650" text-anchor="middle" font-size="13" fill="#78350f">to operator devices</text>


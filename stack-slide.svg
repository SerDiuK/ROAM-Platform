  <text x="280" y="468" text-anchor="middle" font-size="14" fill="#1e40af">Next.js · React · Leaflet</text>
  <text x="280" y="492" text-anchor="middle" font-size="13" fill="#1e40af">commander · live map · briefing review</text>

  <rect x="80" y="580" width="400" height="120" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
